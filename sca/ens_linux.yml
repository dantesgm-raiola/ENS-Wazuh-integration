policy:
  id: "ens_linux"
  file: "ens_linux.yml"
  name: "ENS (Esquema Nacional de Seguridad) - Linux"
  description: "Security configuration checks based on the Spanish National Security Framework (Real Decreto 311/2022) for Wazuh 5.x. Each check carries its ENS control and minimum level in check.references (ens:<control>, ens-level:<level>) and in the check name."
  references:
    - https://www.boe.es/boe/dias/2022/05/03/pdfs/BOE-A-2022-7191.pdf
    - https://github.com/fredycibersec/ENS-Wazuh-integration

requirements:
  name: "Linux"
  description: "Requirements to run this SCA policy"
  condition: any
  rules:
    - 'f:/proc/sys/kernel/ostype -> r:Linux'

variables:
  $audit_conf: /etc/audit/auditd.conf
  $login_defs: /etc/login.defs
  $pam_d: /etc/pam.d
  $sudoers: /etc/sudoers
  $sysctl_conf: /etc/sysctl.conf

checks:

  ############################################################
  # op.acc — Control de Acceso
  ############################################################

  # op.acc.1 — Identificación

  - id: 30001
    name: "Ensure SSH root login is disabled [op.acc.1] [Básico]"
    description: "The root account should not be allowed to login directly via SSH."
    rationale: "Direct root login bypasses individual accountability. ENS op.acc.1 requires proper user identification."
    remediation: "Set 'PermitRootLogin no' in /etc/ssh/sshd_config (above any Include/Match block) and reload sshd. Verify with: sshd -T | grep -i permitrootlogin"
    references:
      - "ens:op.acc.1"
      - "ens-level:basico"
      - "iso27001-2022:5.16"
    compliance:
      nis2: ["21.2.i"]
    condition: all
    rules:
      - 'c:sshd -T -> r:^permitrootlogin\s+no$'

  - id: 30002
    name: "Ensure no duplicate UIDs exist [op.acc.1] [Básico]"
    description: "All UIDs assigned in /etc/passwd must be unique."
    rationale: "Duplicate UIDs make individual user identification impossible and can allow privilege escalation."
    remediation: "Review /etc/passwd and ensure all UIDs are unique."
    references:
      - "ens:op.acc.1"
      - "ens-level:basico"
      - "iso27001-2022:5.16"
    compliance:
      nis2: ["21.2.i"]
    condition: none
    rules:
      - 'c:awk -F: "seen[$3]++{print $1}" /etc/passwd -> r:\w'

  - id: 30003
    name: "Ensure no duplicate usernames exist [op.acc.1] [Básico]"
    description: "All usernames in /etc/passwd must be unique."
    rationale: "Duplicate usernames cause authentication ambiguity and access control bypass."
    remediation: "Review /etc/passwd and remove or rename duplicate accounts."
    references:
      - "ens:op.acc.1"
      - "ens-level:basico"
      - "iso27001-2022:5.16"
    compliance:
      nis2: ["21.2.i"]
    condition: none
    rules:
      - 'c:awk -F: "seen[$1]++{print $1}" /etc/passwd -> r:\w'

  - id: 30004
    name: "Ensure default system accounts are non-login [op.acc.1] [Básico]"
    description: "System accounts (UID < 1000) should not have a valid login shell."
    rationale: "Service accounts should not be usable for interactive login."
    remediation: "Set the shell for system accounts to /sbin/nologin or /bin/false."
    references:
      - "ens:op.acc.1"
      - "ens-level:basico"
      - "iso27001-2022:5.16"
    compliance:
      nis2: ["21.2.i"]
    condition: none
    rules:
      - 'c:awk -F: "($3 < 1000 && $1 != \"root\" && $7 !~ /nologin|false/) {print $1}" /etc/passwd -> r:\w'

  - id: 30005
    name: "Ensure /etc/shadow permissions are 640 or more restrictive [op.acc.1] [Básico]"
    description: "The /etc/shadow file must be owned by root and not world-readable."
    rationale: "Password hashes in /etc/shadow must be accessible only to root. World-readable permissions allow offline password cracking."
    remediation: "Run: chown root:shadow /etc/shadow && chmod 640 /etc/shadow"
    references:
      - "ens:op.acc.1"
      - "ens-level:basico"
      - "iso27001-2022:5.16"
    compliance:
      nis2: ["21.2.i"]
    condition: all
    rules:
      - 'c:stat -c "%a %U" /etc/shadow -> r:^(640|600|000) root'

  - id: 30006
    name: "Ensure /etc/passwd permissions are 644 [op.acc.1] [Básico]"
    description: "The /etc/passwd file must be owned by root with permissions 644."
    rationale: "World-writable /etc/passwd allows any user to modify accounts or create privileged accounts."
    remediation: "Run: chown root:root /etc/passwd && chmod 644 /etc/passwd"
    references:
      - "ens:op.acc.1"
      - "ens-level:basico"
      - "iso27001-2022:5.16"
    compliance:
      nis2: ["21.2.i"]
    condition: all
    rules:
      - 'c:stat -c "%a %U" /etc/passwd -> r:^644 root'

  # op.acc.2 — Requisitos de acceso

  - id: 30010
    name: "Ensure password minimum length is 12 or more [op.acc.2] [Básico]"
    description: "Password minimum length must be at least 12 characters."
    rationale: "Short passwords are vulnerable to brute force. ENS op.acc.2 mandates adequate access requirements."
    remediation: "Set PASS_MIN_LEN to 12 or more in /etc/login.defs."
    references:
      - "ens:op.acc.2"
      - "ens-level:basico"
      - "iso27001-2022:5.15"
    compliance:
      nis2: ["21.2.i"]
    condition: all
    rules:
      - 'f:$login_defs -> n:^\s*PASS_MIN_LEN\s+(\d+) compare >= 12'

  - id: 30011
    name: "Ensure password maximum age is 90 days or less [op.acc.2] [Básico]"
    description: "Passwords must expire within 90 days."
    rationale: "Regular password rotation limits exposure time of compromised credentials."
    remediation: "Set PASS_MAX_DAYS to 90 or less in /etc/login.defs."
    references:
      - "ens:op.acc.2"
      - "ens-level:basico"
      - "iso27001-2022:5.15"
    compliance:
      nis2: ["21.2.i"]
    condition: all
    rules:
      - 'f:$login_defs -> n:^\s*PASS_MAX_DAYS\s+(\d+) compare <= 90'
      - 'f:$login_defs -> n:^\s*PASS_MAX_DAYS\s+(\d+) compare > 0'

  - id: 30012
    name: "Ensure password minimum age is 1 day or more [op.acc.2] [Básico]"
    description: "Minimum days between password changes must be at least 1."
    rationale: "Prevents users from cycling through passwords to reuse old ones immediately."
    remediation: "Set PASS_MIN_DAYS to 1 or more in /etc/login.defs."
    references:
      - "ens:op.acc.2"
      - "ens-level:basico"
      - "iso27001-2022:5.15"
    compliance:
      nis2: ["21.2.i"]
    condition: all
    rules:
      - 'f:$login_defs -> r:^\s*PASS_MIN_DAYS\s+[1-9]'

  - id: 30013
    name: "Ensure password expiry warning is 7 days or more [op.acc.2] [Básico]"
    description: "Users must receive a warning at least 7 days before password expiry."
    rationale: "Advance warning prevents unexpected access loss."
    remediation: "Set PASS_WARN_AGE to 7 or more in /etc/login.defs."
    references:
      - "ens:op.acc.2"
      - "ens-level:basico"
      - "iso27001-2022:5.15"
    compliance:
      nis2: ["21.2.i"]
    condition: all
    rules:
      - 'f:$login_defs -> n:^\s*PASS_WARN_AGE\s+(\d+) compare >= 7'

  - id: 30014
    name: "Ensure password complexity is enforced via pam_pwquality [op.acc.2] [Básico]"
    description: "pam_pwquality must be configured with a minimum length of 12 and at least 3 character classes."
    rationale: "login.defs PASS_MIN_LEN is ignored by PAM on modern distributions. pam_pwquality is the effective enforcement mechanism for ENS op.acc.2 password requirements."
    remediation: "Set minlen=12 and minclass=3 in /etc/security/pwquality.conf and ensure pam_pwquality.so is active in /etc/pam.d/common-password or system-auth."
    references:
      - "ens:op.acc.2"
      - "ens-level:basico"
      - "iso27001-2022:5.15"
    compliance:
      nis2: ["21.2.i"]
    condition: any
    rules:
      - 'f:/etc/security/pwquality.conf -> n:^\s*minlen\s*=\s*(\d+) compare >= 12'
      - 'd:/etc/security/pwquality.conf.d -> r:\.conf$ -> n:^\s*minlen\s*=\s*(\d+) compare >= 12'
      - 'f:/etc/pam.d/common-password -> n:pam_pwquality\.so.*minlen=(\d+) compare >= 12'
      - 'f:/etc/pam.d/system-auth -> n:pam_pwquality\.so.*minlen=(\d+) compare >= 12'

  # op.acc.3 — Segregación de funciones

  - id: 30020
    name: "Ensure sudo is installed [op.acc.3] [Básico]"
    description: "sudo must be installed to enforce least privilege access."
    rationale: "ENS op.acc.3 requires segregation of duties. sudo enables controlled privilege escalation."
    remediation: "Install sudo: apt install sudo / yum install sudo."
    references:
      - "ens:op.acc.3"
      - "ens-level:basico"
      - "iso27001-2022:5.3"
    compliance:
      nis2: ["21.2.i"]
    condition: any
    rules:
      - 'f:/usr/bin/sudo'
      - 'f:/bin/sudo'

  - id: 30021
    name: "Ensure NOPASSWD is not configured for sensitive commands [op.acc.3] [Básico]"
    description: "The NOPASSWD tag must not be used in active sudoers entries (comments are ignored)."
    rationale: "NOPASSWD allows privilege escalation without authentication, violating the segregation requirement."
    remediation: "Review and remove NOPASSWD from /etc/sudoers and /etc/sudoers.d/."
    references:
      - "ens:op.acc.3"
      - "ens-level:basico"
      - "iso27001-2022:5.3"
    compliance:
      nis2: ["21.2.i"]
    condition: none
    rules:
      - 'f:/etc/sudoers -> r:^\s*[^#\s].*NOPASSWD'
      - 'd:/etc/sudoers.d -> r:^[^.~]+$ -> r:^\s*[^#\s].*NOPASSWD'

  - id: 30022
    name: "Ensure default umask is 027 or more restrictive [op.acc.3] [Básico]"
    description: "The default file creation mask must be 027 or more restrictive (e.g. 077)."
    rationale: "A permissive umask (e.g. 022) creates files readable by all users. ENS op.acc.3 requires that access to resources is granted with least privilege."
    remediation: "Set UMASK 027 in /etc/login.defs and add 'umask 027' to /etc/profile or /etc/profile.d/umask.sh."
    references:
      - "ens:op.acc.3"
      - "ens-level:basico"
      - "iso27001-2022:5.3"
    compliance:
      nis2: ["21.2.i"]
    condition: any
    rules:
      - 'f:$login_defs -> r:^\s*UMASK\s+0*[0-7]?[2367]7\s*$'
      - 'f:/etc/profile -> r:^\s*umask\s+0*[0-7]?[2367]7\s*$'
      - 'd:/etc/profile.d -> r:\.sh$ -> r:^\s*umask\s+0*[0-7]?[2367]7\s*$'

  # op.acc.6 — Mecanismo de autenticación (usuarios de la organización)

  - id: 30030
    name: "Ensure SSH MaxAuthTries is 4 or less [op.acc.6] [Básico]"
    description: "SSH authentication attempts must be limited."
    rationale: "Limiting retries protects against brute force attacks on SSH."
    remediation: "Set MaxAuthTries to 4 or less in /etc/ssh/sshd_config."
    references:
      - "ens:op.acc.6"
      - "ens-level:basico"
      - "iso27001-2022:8.5"
    compliance:
      nis2: ["21.2.i"]
    condition: all
    rules:
      - 'c:sshd -T -> n:^maxauthtries\s+(\d+) compare <= 4'

  - id: 30031
    name: "Ensure SSH idle timeout is configured [op.acc.6] [Básico]"
    description: "SSH sessions must time out after inactivity."
    rationale: "Unattended SSH sessions are a significant security risk."
    remediation: "Set 'ClientAliveInterval 300' and 'ClientAliveCountMax 3' (or lower, but not 0: 0 disables the timeout on current OpenSSH) in /etc/ssh/sshd_config and reload sshd."
    references:
      - "ens:op.acc.6"
      - "ens-level:basico"
      - "iso27001-2022:8.5"
    compliance:
      nis2: ["21.2.i"]
    condition: all
    rules:
      - 'c:sshd -T -> n:^clientaliveinterval\s+(\d+) compare > 0'
      - 'c:sshd -T -> n:^clientaliveinterval\s+(\d+) compare <= 900'
      - 'c:sshd -T -> n:^clientalivecountmax\s+(\d+) compare > 0'
      - 'c:sshd -T -> n:^clientalivecountmax\s+(\d+) compare <= 3'

  - id: 30032
    name: "Ensure SSH PermitEmptyPasswords is disabled [op.acc.6] [Básico]"
    description: "SSH must not allow authentication with empty passwords."
    rationale: "Empty passwords provide no security whatsoever."
    remediation: "Set PermitEmptyPasswords no in /etc/ssh/sshd_config."
    references:
      - "ens:op.acc.6"
      - "ens-level:basico"
      - "iso27001-2022:8.5"
    compliance:
      nis2: ["21.2.i"]
    condition: all
    rules:
      - 'c:sshd -T -> r:^permitemptypasswords\s+no$'

  - id: 30033
    name: "Ensure SSH HostbasedAuthentication is disabled [op.acc.6] [Básico]"
    description: "Host-based authentication should be disabled."
    rationale: "Host-based auth relies on IP/hostname which can be spoofed."
    remediation: "Set HostbasedAuthentication no in /etc/ssh/sshd_config."
    references:
      - "ens:op.acc.6"
      - "ens-level:basico"
      - "iso27001-2022:8.5"
    compliance:
      nis2: ["21.2.i"]
    condition: all
    rules:
      - 'c:sshd -T -> r:^hostbasedauthentication\s+no$'

  - id: 30034
    name: "Ensure SSH login warning banner is configured [op.acc.6] [Básico]"
    description: "SSH must display a legal warning banner before authentication."
    rationale: "Legal notice is required for authorized-use-only systems."
    remediation: "Set Banner /etc/issue.net in /etc/ssh/sshd_config."
    references:
      - "ens:op.acc.6"
      - "ens-level:basico"
      - "iso27001-2022:8.5"
    compliance:
      nis2: ["21.2.i"]
    condition: all
    rules:
      - 'c:sshd -T -> r:^banner\s+/'

  - id: 30035
    name: "Ensure SSH does not offer weak key exchange algorithms [op.acc.6] [Medio]"
    description: "The effective sshd configuration must not offer SHA-1 based or 1024-bit Diffie-Hellman key exchange."
    rationale: "Weak key exchange can be exploited to compromise session keys."
    remediation: "Set KexAlgorithms to curve25519-sha256,diffie-hellman-group14-sha256 or better in sshd_config."
    references:
      - "ens:op.acc.6"
      - "ens-level:medio"
      - "iso27001-2022:8.5"
    compliance:
      nis2: ["21.2.i"]
    condition: none
    rules:
      - 'c:sshd -T -> r:^kexalgorithms && r:diffie-hellman-group1-sha1|diffie-hellman-group14-sha1|diffie-hellman-group-exchange-sha1'

  # op.acc.7 — Acceso remoto

  - id: 30040
    name: "Ensure SSH AllowTcpForwarding is disabled [op.acc.7] [Medio]"
    description: "TCP forwarding through SSH should be disabled."
    rationale: "TCP forwarding can bypass network controls and expose internal services."
    remediation: "Set AllowTcpForwarding no in /etc/ssh/sshd_config."
    references:
      - "ens:op.acc.7"
      - "ens-level:medio"
      - "iso27001-2022:6.7"
    compliance:
      nis2: ["21.2.i"]
    condition: all
    rules:
      - 'c:sshd -T -> r:^allowtcpforwarding\s+no$'

  - id: 30041
    name: "Ensure SSH X11Forwarding is disabled [op.acc.7] [Medio]"
    description: "X11 forwarding via SSH should be disabled."
    rationale: "X11 forwarding exposes the local display to injection risks."
    remediation: "Set X11Forwarding no in /etc/ssh/sshd_config."
    references:
      - "ens:op.acc.7"
      - "ens-level:medio"
      - "iso27001-2022:6.7"
    compliance:
      nis2: ["21.2.i"]
    condition: all
    rules:
      - 'c:sshd -T -> r:^x11forwarding\s+no$'

  - id: 30042
    name: "Ensure SSH agent forwarding is disabled [op.acc.7] [Medio]"
    description: "SSH agent forwarding must be disabled on servers."
    rationale: "Agent forwarding allows the remote server to use the local SSH agent, meaning a compromised server can use your keys to authenticate elsewhere."
    remediation: "Set AllowAgentForwarding no in /etc/ssh/sshd_config and restart the SSH service."
    references:
      - "ens:op.acc.7"
      - "ens-level:medio"
      - "iso27001-2022:6.7"
    compliance:
      nis2: ["21.2.i"]
    condition: all
    rules:
      - 'c:sshd -T -> r:^allowagentforwarding\s+no$'

  ############################################################
  # op.exp — Explotación
  ############################################################

  # op.exp.2 — Configuración de seguridad

  - id: 30100
    name: "Ensure filesystem integrity checking tool is installed [op.exp.2] [Básico]"
    description: "AIDE or equivalent must be installed for file integrity monitoring."
    rationale: "ENS op.exp.2 requires configuration verification. Integrity tools detect unauthorized changes."
    remediation: "Install AIDE: apt install aide / yum install aide."
    references:
      - "ens:op.exp.2"
      - "ens-level:basico"
      - "iso27001-2022:8.9"
    compliance:
      nis2: ["21.2.e"]
    condition: any
    rules:
      - 'f:/usr/bin/aide'
      - 'f:/usr/sbin/aide'

  - id: 30101
    name: "Ensure ASLR is enabled [op.exp.2] [Básico]"
    description: "Address Space Layout Randomization must be enabled."
    rationale: "ASLR makes exploitation of memory vulnerabilities significantly harder."
    remediation: "Set kernel.randomize_va_space = 2 in /etc/sysctl.conf."
    references:
      - "ens:op.exp.2"
      - "ens-level:basico"
      - "iso27001-2022:8.9"
    compliance:
      nis2: ["21.2.e"]
    condition: all
    rules:
      - 'f:/proc/sys/kernel/randomize_va_space -> r:^2$'

  - id: 30102
    name: "Ensure core dumps are restricted [op.exp.2] [Básico]"
    description: "Core dumps from SUID programs must be restricted."
    rationale: "Core dumps can expose sensitive data including passwords and cryptographic material."
    remediation: "Set fs.suid_dumpable = 0 in /etc/sysctl.conf."
    references:
      - "ens:op.exp.2"
      - "ens-level:basico"
      - "iso27001-2022:8.9"
    compliance:
      nis2: ["21.2.e"]
    condition: all
    rules:
      - 'f:/proc/sys/fs/suid_dumpable -> r:^0$'

  - id: 30103
    name: "Ensure SELinux or AppArmor is active and enforcing [op.exp.2] [Medio]"
    description: "SELinux must be in enforcing mode, or AppArmor must be enabled with at least one profile in enforce mode."
    rationale: "MAC limits the damage from compromised processes by enforcing least privilege at the kernel level."
    remediation: "Enable SELinux in enforcing mode (setenforce 1) or configure AppArmor profiles."
    references:
      - "ens:op.exp.2"
      - "ens-level:medio"
      - "iso27001-2022:8.9"
    compliance:
      nis2: ["21.2.e"]
    condition: any
    rules:
      - 'f:/sys/fs/selinux/enforce -> r:^1$'
      - 'f:/sys/kernel/security/apparmor/profiles -> r:\(enforce\)$'

  - id: 30104
    name: "Ensure IP forwarding is disabled [op.exp.2] [Básico]"
    description: "IP forwarding should be disabled on non-router systems."
    rationale: "Enabling IP forwarding can turn the system into an unintended network relay. Hosts that route by design (container hosts, hypervisors, VPN gateways) are expected to fail this check; document the exception."
    remediation: "Set net.ipv4.ip_forward = 0 in /etc/sysctl.conf."
    references:
      - "ens:op.exp.2"
      - "ens-level:basico"
      - "iso27001-2022:8.9"
    compliance:
      nis2: ["21.2.e"]
    condition: all
    rules:
      - 'f:/proc/sys/net/ipv4/ip_forward -> r:^0$'

  - id: 30105
    name: "Ensure source routing is disabled [op.exp.2] [Básico]"
    description: "Source-routed packets should be rejected."
    rationale: "Source routing can be used to bypass firewalls and route traffic through attacker paths."
    remediation: "Set net.ipv4.conf.all.accept_source_route = 0 in /etc/sysctl.conf."
    references:
      - "ens:op.exp.2"
      - "ens-level:basico"
      - "iso27001-2022:8.9"
    compliance:
      nis2: ["21.2.e"]
    condition: all
    rules:
      - 'f:/proc/sys/net/ipv4/conf/all/accept_source_route -> r:^0$'

  - id: 30106
    name: "Ensure /tmp is mounted with noexec, nosuid, and nodev [op.exp.2] [Básico]"
    description: "The /tmp filesystem must be mounted with noexec, nosuid, and nodev options."
    rationale: "Attackers commonly use /tmp to store and execute malicious binaries. noexec prevents execution, nosuid prevents privilege escalation via SUID binaries, nodev prevents device file creation."
    remediation: "Add the options noexec,nosuid,nodev to the /tmp entry in /etc/fstab and remount: mount -o remount /tmp"
    references:
      - "ens:op.exp.2"
      - "ens-level:basico"
      - "iso27001-2022:8.9"
    compliance:
      nis2: ["21.2.e"]
    condition: all
    rules:
      - 'f:/proc/mounts -> r:\s/tmp\s.*noexec'
      - 'f:/proc/mounts -> r:\s/tmp\s.*nosuid'
      - 'f:/proc/mounts -> r:\s/tmp\s.*nodev'

  - id: 30107
    name: "Ensure ptrace scope is restricted [op.exp.2] [Básico]"
    description: "The kernel.yama.ptrace_scope must be set to 1 or higher."
    rationale: "ptrace allows a process to inspect the memory of another. Restricting it to parent processes prevents local privilege escalation and memory extraction attacks."
    remediation: "Set kernel.yama.ptrace_scope = 1 in /etc/sysctl.conf and apply with: sysctl -p"
    references:
      - "ens:op.exp.2"
      - "ens-level:basico"
      - "iso27001-2022:8.9"
    compliance:
      nis2: ["21.2.e"]
    condition: all
    rules:
      - 'f:/proc/sys/kernel/yama/ptrace_scope -> r:^[1-3]$'

  - id: 30108
    name: "Ensure kernel log access is restricted to root [op.exp.2] [Medio]"
    description: "The kernel.dmesg_restrict parameter must be set to 1."
    rationale: "The kernel ring buffer (dmesg) can expose memory addresses and system internals useful for ASLR bypass. ENS op.exp.2 Medio requires hardened system configuration."
    remediation: "Set kernel.dmesg_restrict = 1 in /etc/sysctl.conf and apply with: sysctl -p"
    references:
      - "ens:op.exp.2"
      - "ens-level:medio"
      - "iso27001-2022:8.9"
    compliance:
      nis2: ["21.2.e"]
    condition: all
    rules:
      - 'f:/proc/sys/kernel/dmesg_restrict -> r:^1$'

  # op.exp.6 — Protección frente a código dañino

  - id: 30110
    name: "Ensure an antimalware or EDR product is installed [op.exp.6] [Básico]"
    description: "An antimalware or endpoint protection product must be present: ESET (eea/efs), ClamAV daemon, Sophos, CrowdStrike Falcon or Microsoft Defender for Endpoint."
    rationale: "ENS op.exp.6 explicitly requires protection against malicious code."
    remediation: "Install the organisation's endpoint protection product. The Wazuh agent alone does not satisfy op.exp.6. Add your product's install path to this check if it is not listed."
    references:
      - "ens:op.exp.6"
      - "ens-level:basico"
      - "iso27001-2022:8.7"
    compliance:
      nis2: ["21.2.e", "21.2.g"]
    condition: any
    rules:
      - 'd:/opt/eset/eea'
      - 'd:/opt/eset/efs'
      - 'p:clamd'
      - 'd:/opt/sophos-spl'
      - 'd:/opt/CrowdStrike'
      - 'd:/opt/microsoft/mdatp'

  # op.exp.8 — Registro de la actividad de los usuarios

  - id: 30120
    name: "Ensure auditd is installed [op.exp.8] [Básico]"
    description: "The auditd daemon must be installed for user activity logging."
    rationale: "ENS op.exp.8 requires logging of all user actions. auditd provides kernel-level audit."
    remediation: "Install auditd: apt install auditd / yum install audit."
    references:
      - "ens:op.exp.8"
      - "ens-level:basico"
      - "iso27001-2022:8.15"
    compliance:
      nis2: ["21.2.b"]
    condition: any
    rules:
      - 'f:/sbin/auditd'
      - 'f:/usr/sbin/auditd'

  - id: 30121
    name: "Ensure auditd service is active [op.exp.8] [Básico]"
    description: "The auditd service must be running."
    rationale: "Logging is only effective if the service is actually running."
    remediation: "Enable and start auditd: systemctl enable --now auditd."
    references:
      - "ens:op.exp.8"
      - "ens-level:basico"
      - "iso27001-2022:8.15"
    compliance:
      nis2: ["21.2.b"]
    condition: all
    rules:
      - 'p:auditd'

  - id: 30122
    name: "Ensure audit log size is configured [op.exp.8] [Básico]"
    description: "Maximum audit log file size must be defined."
    rationale: "Unbounded log size can exhaust disk space or be used to evade audit."
    remediation: "Set max_log_file in /etc/audit/auditd.conf (e.g., max_log_file = 100)."
    references:
      - "ens:op.exp.8"
      - "ens-level:basico"
      - "iso27001-2022:8.15"
    compliance:
      nis2: ["21.2.b"]
    condition: all
    rules:
      - 'f:$audit_conf -> r:^\s*max_log_file\s*=\s*[1-9]'

  - id: 30123
    name: "Ensure audit logs are retained [op.exp.8, op.exp.10] [Medio]"
    description: "Audit logs must be kept and not automatically deleted."
    rationale: "ENS op.exp.10 requires protection of activity logs. Deletion undermines forensic capability."
    remediation: "Set max_log_file_action = keep_logs in /etc/audit/auditd.conf."
    references:
      - "ens:op.exp.8"
      - "ens:op.exp.10"
      - "ens-level:medio"
      - "iso27001-2022:8.15"
    compliance:
      nis2: ["21.2.b"]
    condition: all
    rules:
      - 'f:$audit_conf -> r:^\s*max_log_file_action\s*=\s*keep_logs'

  - id: 30124
    name: "Ensure login and logout events are audited [op.exp.8] [Básico]"
    description: "User login and logout events must be captured."
    rationale: "Session tracking is fundamental for accountability and incident investigation."
    remediation: "Add a watch on the login records to the audit rules, e.g. '-w /var/log/lastlog -p wa -k logins' (or /var/log/wtmp, or /var/lib/wtmpdb on Debian 13+), then load them with augenrules --load."
    references:
      - "ens:op.exp.8"
      - "ens-level:basico"
      - "iso27001-2022:8.15"
    compliance:
      nis2: ["21.2.b"]
    condition: all
    rules:
      - 'c:auditctl -l -> r:^-w\s+(/var/log/lastlog|/var/log/wtmp|/var/lib/wtmpdb\S*)\s+-p\s+wa'

  - id: 30125
    name: "Ensure sudo usage is audited [op.exp.8] [Medio]"
    description: "All sudo command executions must be logged."
    rationale: "Privileged command execution must be traceable for accountability."
    remediation: "Add: -w /usr/bin/sudo -p x -k sudo_usage in audit rules."
    references:
      - "ens:op.exp.8"
      - "ens-level:medio"
      - "iso27001-2022:8.15"
    compliance:
      nis2: ["21.2.b"]
    condition: all
    rules:
      - 'c:auditctl -l -> r:/usr/bin/sudo'

  - id: 30126
    name: "Ensure a time synchronization service is active [op.exp.8] [Básico]"
    description: "A time synchronization daemon (chronyd, ntpd, or systemd-timesyncd) must be installed and running."
    rationale: "Accurate timestamps are fundamental for audit log integrity and forensic correlation. ENS op.exp.8 requires reliable activity records."
    remediation: "Install and enable chrony: apt install chrony && systemctl enable --now chronyd"
    references:
      - "ens:op.exp.8"
      - "ens-level:basico"
      - "iso27001-2022:8.15"
    compliance:
      nis2: ["21.2.b"]
    condition: any
    rules:
      - 'c:timedatectl show -p NTPSynchronized --value -> r:^yes$'
      - 'c:systemctl is-active chrony -> r:^active'
      - 'c:systemctl is-active chronyd -> r:^active'
      - 'c:systemctl is-active ntpsec -> r:^active'
      - 'c:systemctl is-active ntpd -> r:^active'
      - 'c:systemctl is-active systemd-timesyncd -> r:^active'

  # op.exp.10 — Protección de los registros de actividad

  - id: 30130
    name: "Ensure system logs are persisted [op.exp.10] [Básico]"
    description: "System logs must be stored persistently: rsyslog or syslog-ng running, or systemd-journald with persistent storage (/var/log/journal)."
    rationale: "ENS op.exp.10 requires management and protection of system logs."
    remediation: "Either run rsyslog/syslog-ng, or enable persistent journald storage: mkdir -p /var/log/journal && systemctl restart systemd-journald (or set Storage=persistent in journald.conf)."
    references:
      - "ens:op.exp.10"
      - "ens-level:basico"
      - "iso27001-2022:8.15"
    compliance:
      nis2: ["21.2.b"]
    condition: any
    rules:
      - 'c:systemctl is-active rsyslog -> r:^active'
      - 'c:systemctl is-active syslog-ng -> r:^active'
      - 'd:/var/log/journal'

  - id: 30131
    name: "Ensure logs are forwarded to a remote collector [op.exp.10] [Medio]"
    description: "System logs must leave the host: rsyslog forwarding, systemd-journal-upload, or the Wazuh agent (which ships the logs it collects to the manager)."
    rationale: "Remote logging ensures logs survive local system compromise or failure."
    remediation: "Make sure the Wazuh agent collects the system logs (journald or log files), or configure rsyslog forwarding (*.* @@collector:514) or systemd-journal-upload."
    references:
      - "ens:op.exp.10"
      - "ens-level:medio"
      - "iso27001-2022:8.15"
    compliance:
      nis2: ["21.2.b"]
    condition: any
    rules:
      - 'f:/etc/rsyslog.conf -> r:^\s*[^#\s].*\s@@?[\w\[]|omfwd'
      - 'd:/etc/rsyslog.d -> r:\.conf$ -> r:^\s*[^#\s].*\s@@?[\w\[]|omfwd'
      - 'c:systemctl is-active systemd-journal-upload -> r:^active'
      - 'p:wazuh-agentd'

  ############################################################
  # op.mon — Monitorización del sistema
  ############################################################

  - id: 30200
    name: "Ensure Wazuh agent is installed and active [op.mon.1] [Básico]"
    description: "The Wazuh agent must be installed and running."
    rationale: "ENS op.mon.1 requires intrusion detection capabilities."
    remediation: "Install and configure the Wazuh agent for this system."
    references:
      - "ens:op.mon.1"
      - "ens-level:basico"
      - "iso27001-2022:8.16"
    compliance:
      nis2: ["21.2.b"]
    condition: all
    rules:
      - 'p:wazuh-agentd'

  - id: 30201
    name: "Ensure host-based firewall is active [op.mon.1] [Básico]"
    description: "A host firewall must be enabled and running."
    rationale: "A local firewall provides perimeter control and reduces attack surface."
    remediation: "Enable ufw (ufw enable) or firewalld (systemctl enable --now firewalld)."
    references:
      - "ens:op.mon.1"
      - "ens-level:basico"
      - "iso27001-2022:8.16"
    compliance:
      nis2: ["21.2.b"]
    condition: any
    rules:
      - 'c:ufw status -> r:Status: active'
      - 'c:firewall-cmd --state -> r:running'
      - 'c:nft list ruleset -> r:hook input'
      - 'c:iptables -S INPUT -> r:^-P INPUT (DROP|REJECT)|^-A INPUT'

  ############################################################
  # mp.com — Protección de las comunicaciones
  ############################################################

  - id: 30300
    name: "Ensure SSH does not offer weak ciphers [mp.com.2] [Medio]"
    description: "The effective sshd configuration must not offer CBC-mode, RC4 (arcfour), Blowfish, CAST or 3DES ciphers."
    rationale: "Weak ciphers can be exploited to decrypt SSH sessions."
    remediation: "Set Ciphers aes256-gcm@openssh.com,chacha20-poly1305@openssh.com,aes256-ctr in sshd_config."
    references:
      - "ens:mp.com.2"
      - "ens-level:medio"
      - "iso27001-2022:8.24"
    compliance:
      nis2: ["21.2.h"]
    condition: none
    rules:
      - 'c:sshd -T -> r:^ciphers && r:3des-cbc|aes128-cbc|aes192-cbc|aes256-cbc|rijndael-cbc|blowfish-cbc|cast128-cbc|arcfour'

  - id: 30301
    name: "Ensure SSH does not offer weak MACs [mp.com.2, mp.com.3] [Medio]"
    description: "The effective sshd configuration must not offer MD5, RIPEMD-160, truncated SHA-1 or 64-bit UMAC message authentication codes."
    rationale: "Weak MACs can allow message tampering in SSH sessions."
    remediation: "Set MACs hmac-sha2-512,hmac-sha2-256 in /etc/ssh/sshd_config."
    references:
      - "ens:mp.com.2"
      - "ens:mp.com.3"
      - "ens-level:medio"
      - "iso27001-2022:8.24"
    compliance:
      nis2: ["21.2.h", "21.2.e"]
    condition: none
    rules:
      - 'c:sshd -T -> r:^macs && r:hmac-md5|hmac-ripemd160|hmac-sha1-96|umac-64'

  - id: 30310
    name: "Ensure package GPG signature verification is enabled [mp.com.3] [Básico]"
    description: "The package manager must verify GPG signatures before installing packages."
    rationale: "ENS mp.com.3 requires authenticity and integrity of software."
    remediation: "Ensure gpgcheck=1 is set in /etc/yum.conf or equivalent."
    references:
      - "ens:mp.com.3"
      - "ens-level:basico"
      - "iso27001-2022:8.24"
    compliance:
      nis2: ["21.2.h", "21.2.e"]
    condition: any
    rules:
      - 'f:/etc/yum.conf -> r:^\s*gpgcheck\s*=\s*1'
      - 'f:/etc/dnf/dnf.conf -> r:^\s*gpgcheck\s*=\s*1'

  - id: 30320
    name: "Ensure SYN flood protection is enabled [mp.s.3, mp.com.4] [Básico]"
    description: "TCP SYN cookies must be enabled."
    rationale: "ENS mp.s.3 requires protection against denial of service. SYN cookies mitigate SYN flood attacks."
    remediation: "Set net.ipv4.tcp_syncookies = 1 in /etc/sysctl.conf."
    references:
      - "ens:mp.s.3"
      - "ens:mp.com.4"
      - "ens-level:basico"
      - "iso27001-2022:8.6"
    compliance:
      nis2: ["21.2.e"]
    condition: all
    rules:
      - 'f:/proc/sys/net/ipv4/tcp_syncookies -> r:^1$'

  - id: 30321
    name: "Ensure ICMP redirects are not accepted [mp.com.4] [Básico]"
    description: "The system must not accept ICMP redirect messages."
    rationale: "ICMP redirects can route traffic through malicious paths."
    remediation: "Set net.ipv4.conf.all.accept_redirects = 0 in /etc/sysctl.conf."
    references:
      - "ens:mp.com.4"
      - "ens-level:basico"
      - "iso27001-2022:8.22"
    compliance:
      nis2: ["21.2.e"]
    condition: all
    rules:
      - 'f:/proc/sys/net/ipv4/conf/all/accept_redirects -> r:^0$'

  - id: 30322
    name: "Ensure IPv6 router advertisements are not accepted [mp.com.4] [Básico]"
    description: "The system should not process IPv6 router advertisements."
    rationale: "Rogue router advertisements can redirect IPv6 traffic."
    remediation: "Set net.ipv6.conf.all.accept_ra = 0 in /etc/sysctl.conf."
    references:
      - "ens:mp.com.4"
      - "ens-level:basico"
      - "iso27001-2022:8.22"
    compliance:
      nis2: ["21.2.e"]
    condition: all
    rules:
      - 'f:/proc/sys/net/ipv6/conf/all/accept_ra -> r:^0$'

  - id: 30323
    name: "Ensure reverse path filtering is enabled [mp.com.4] [Básico]"
    description: "Reverse path source validation must be enabled (rp_filter = 1)."
    rationale: "Reverse path filtering drops packets whose source address does not match the interface they arrived on, mitigating IP spoofing attacks."
    remediation: "Set net.ipv4.conf.all.rp_filter = 1 in /etc/sysctl.conf and apply with: sysctl -p"
    references:
      - "ens:mp.com.4"
      - "ens-level:basico"
      - "iso27001-2022:8.22"
    compliance:
      nis2: ["21.2.e"]
    condition: all
    rules:
      - 'f:/proc/sys/net/ipv4/conf/all/rp_filter -> r:^1$'

  - id: 30324
    name: "Ensure ICMP broadcast requests are ignored [mp.com.4] [Básico]"
    description: "The system must not respond to ICMP broadcast echo requests (Smurf amplification)."
    rationale: "Responding to broadcast ICMP requests can amplify DoS attacks. ENS mp.s.3 and mp.com.4 require protection against network-level attacks."
    remediation: "Set net.ipv4.icmp_echo_ignore_broadcasts = 1 in /etc/sysctl.conf and apply with: sysctl -p"
    references:
      - "ens:mp.com.4"
      - "ens-level:basico"
      - "iso27001-2022:8.22"
    compliance:
      nis2: ["21.2.e"]
    condition: all
    rules:
      - 'f:/proc/sys/net/ipv4/icmp_echo_ignore_broadcasts -> r:^1$'

  - id: 30325
    name: "Ensure bogus ICMP responses are logged [mp.com.4] [Básico]"
    description: "Martian packets (packets with impossible source addresses) must be logged."
    rationale: "Logging martian packets helps detect IP spoofing and network scanning attempts, supporting ENS op.exp.8 activity monitoring requirements."
    remediation: "Set net.ipv4.conf.all.log_martians = 1 in /etc/sysctl.conf and apply with: sysctl -p"
    references:
      - "ens:mp.com.4"
      - "ens-level:basico"
      - "iso27001-2022:8.22"
    compliance:
      nis2: ["21.2.e"]
    condition: all
    rules:
      - 'f:/proc/sys/net/ipv4/conf/all/log_martians -> r:^1$'

  ############################################################
  # mp.eq — Protección de los equipos
  ############################################################

  - id: 30400
    name: "Ensure shell timeout is 900 seconds or less [mp.eq.2] [Básico]"
    description: "Interactive shell sessions must time out after at most 15 minutes of inactivity (TMOUT between 1 and 900)."
    rationale: "ENS mp.eq.2 requires workstation locking after a period of inactivity."
    remediation: "Set TMOUT=600 (or lower) in /etc/profile or /etc/profile.d/timeout.sh."
    references:
      - "ens:mp.eq.2"
      - "ens-level:basico"
      - "iso27001-2022:8.1"
    compliance:
      nis2: ["21.2.i"]
    condition: any
    rules:
      - 'f:/etc/profile -> r:^\s*(readonly\s+|export\s+|declare\s+-r\s+)?TMOUT=([1-9]|[1-9]\d|[1-8]\d\d|900)\b'
      - 'f:/etc/bash.bashrc -> r:^\s*(readonly\s+|export\s+|declare\s+-r\s+)?TMOUT=([1-9]|[1-9]\d|[1-8]\d\d|900)\b'
      - 'd:/etc/profile.d -> r:\.sh$ -> r:^\s*(readonly\s+|export\s+|declare\s+-r\s+)?TMOUT=([1-9]|[1-9]\d|[1-8]\d\d|900)\b'

  ############################################################
  # mp.info — Protección de la información
  ############################################################

  - id: 30500
    name: "Ensure disk encryption is in use [mp.info.3] [Medio]"
    description: "Sensitive data partitions should use LUKS encryption."
    rationale: "ENS mp.info.3 requires encryption of sensitive information at rest."
    remediation: "Use LUKS to encrypt sensitive partitions (cryptsetup luksFormat)."
    references:
      - "ens:mp.info.3"
      - "ens-level:medio"
      - "iso27001-2022:8.24"
    compliance:
      nis2: ["21.2.h"]
    condition: any
    rules:
      - 'c:lsblk -rno TYPE -> r:^crypt$'
      - 'c:dmsetup ls --target crypt -> r:^\S+\s+\('

  - id: 30510
    name: "Ensure a backup client is installed [mp.info.9] [Básico]"
    description: "A backup client must be present: restic, borg, kopia, Proxmox Backup client, Bacula, duplicity, rsnapshot or Veeam agent. This proves the tool is installed, not that backups run."
    rationale: "ENS mp.info.9 requires regular backups to ensure recovery capability."
    remediation: "Install and schedule the organisation's backup client. Add its binary path to this check if it is not listed."
    references:
      - "ens:mp.info.9"
      - "ens-level:basico"
      - "iso27001-2022:8.13"
    compliance:
      nis2: ["21.2.c"]
    condition: any
    rules:
      - 'f:/usr/bin/restic'
      - 'f:/usr/bin/borg'
      - 'f:/usr/bin/kopia'
      - 'f:/usr/bin/proxmox-backup-client'
      - 'f:/usr/sbin/bacula-fd'
      - 'f:/usr/bin/duplicity'
      - 'f:/usr/bin/rsnapshot'
      - 'f:/usr/bin/veeamconfig'

  ############################################################
  # mp.s — Protección de los servicios
  ############################################################

  - id: 30600
    name: "Ensure Telnet is not installed [mp.s.2] [Básico]"
    description: "The telnet client and server must not be installed."
    rationale: "Telnet transmits data in cleartext including credentials. It must not be used."
    remediation: "Remove telnet: apt remove telnet / yum remove telnet."
    references:
      - "ens:mp.s.2"
      - "ens-level:basico"
      - "iso27001-2022:8.26"
    compliance:
      nis2: ["21.2.e"]
    condition: none
    rules:
      - 'c:rpm -q telnet -> r:^telnet-'
      - 'c:dpkg -s telnet -> r:Status: install ok installed'

  - id: 30601
    name: "Ensure rsh, rlogin, and rexec are not installed [mp.s.2] [Básico]"
    description: "Legacy r-commands must not be installed."
    rationale: "r-commands use cleartext and host-based authentication, both insecure."
    remediation: "Remove rsh-client and rsh-server packages."
    references:
      - "ens:mp.s.2"
      - "ens-level:basico"
      - "iso27001-2022:8.26"
    compliance:
      nis2: ["21.2.e"]
    condition: none
    rules:
      - 'c:dpkg -s rsh-client -> r:Status: install ok installed'
      - 'c:rpm -q rsh -> r:^rsh-'

  - id: 30602
    name: "Ensure FTP server is not installed [mp.s.2] [Básico]"
    description: "FTP server software (vsftpd, proftpd) must not be installed."
    rationale: "FTP transmits credentials and data in cleartext. ENS mp.s.2 requires that only secure, necessary services are available."
    remediation: "Remove FTP servers: apt remove vsftpd proftpd / yum remove vsftpd proftpd"
    references:
      - "ens:mp.s.2"
      - "ens-level:basico"
      - "iso27001-2022:8.26"
    compliance:
      nis2: ["21.2.e"]
    condition: none
    rules:
      - 'c:rpm -q vsftpd -> r:^vsftpd-'
      - 'c:dpkg -s vsftpd -> r:Status: install ok installed'
      - 'c:rpm -q proftpd -> r:^proftpd-'
      - 'c:dpkg -s proftpd -> r:Status: install ok installed'

  ############################################################
  # mp.sw — Protección de las aplicaciones informáticas
  ############################################################

  - id: 30700
    name: "Ensure automatic security updates are configured [mp.sw.2] [Básico]"
    description: "The system should apply security updates automatically."
    rationale: "ENS mp.sw.2 requires verification and maintenance of software in service."
    remediation: "Debian/Ubuntu: apt install unattended-upgrades && dpkg-reconfigure -plow unattended-upgrades. RHEL family: dnf install dnf-automatic && systemctl enable --now dnf-automatic-install.timer"
    references:
      - "ens:mp.sw.2"
      - "ens-level:basico"
      - "iso27001-2022:8.29"
    compliance:
      nis2: ["21.2.e"]
    condition: any
    rules:
      - 'f:/etc/apt/apt.conf.d/20auto-upgrades -> r:^\s*APT::Periodic::Unattended-Upgrade\s+"1"'
      - 'c:systemctl is-enabled dnf-automatic.timer -> r:^enabled'
      - 'c:systemctl is-enabled dnf-automatic-install.timer -> r:^enabled'
