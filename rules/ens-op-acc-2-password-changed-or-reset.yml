# Deployment state, written by tools/deploy_rules.py (only these five lines are rewritten).
# The content-manager API has no read endpoint, so these lines are the local record of what is
# deployed. Empty values mean "never deployed". `detector_index` is deploy config, not sent to the API.
document_id: "44e4501e-ec18-4a0e-91f8-3a9998234692"
integration_id: "3e365fa4-836b-48cc-b87f-8d86bbf4c317"
space: "custom"
detector: "_YjnFKIBHEAyeSYys-7s"
sa_native_id: "8d19e469-14c4-4903-8c7e-8a2a5d6fd500"
detector_index: "wazuh-events-v5-system-activity"

enabled: true
status: "experimental"
level: "low"

metadata:
  title: "ENS op.acc.2: Password changed or reset"
  author: "ENS-Wazuh-integration"
  date: "2026-11-25"
  modified: "2026-11-25"
  description: >-
    A Windows account password was changed by its owner (4723) or reset by another account (4724).
    Evidence for ENS op.acc.2 (access requirements / credential lifecycle). Linux passwd/chpasswd
    events were not present in the indexed data, so Linux is not covered.
  references:
    - "Migrated from ENS-Wazuh-integration 4.x rule 100210"
    - "https://www.boe.es/buscar/act.php?id=BOE-A-2022-7191"

logsource:
  product: "ens-compliance"

detection:
  condition: "selection and not filter_lenovo_tmp"
  selection:
    wazuh.integration.name: "windows"
    event.action:
      - "password-changed"
      - "password-reset"
  filter_lenovo_tmp:   # Lenovo Vantage temporary accounts, see falsepositives
    user.target.name|startswith: "lenovo_tmp_"

mitre:
  tactic:
    - "TA0003"
  technique:
    - "T1098"
  subtechnique: []

compliance:
  nis2:
    - "21.2.i"

tags:
  - "ens.op.acc.2"
  - "iso27001-2022.5.15"
  - "iso27001-2022.5.17"
  - "attack.persistence"
  - "attack.t1098"

falsepositives:
  - "Scheduled password rotation"
  - "Help-desk resets"
  - "Lenovo Vantage / System Update creates, adds to Administrators and deletes temporary local accounts named lenovo_tmp_* (seen 2026-08..11 on GR-*/RN-* laptops)."
