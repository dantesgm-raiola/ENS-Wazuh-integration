metadata:
  title: "ENS op.exp.8: Linux audit daemon stopped"
  author: "ENS-Wazuh-integration"
  date: "2026-11-25"
  modified: "2026-11-25"
  description: >-
    auditd logged DAEMON_END or DAEMON_ABORT: kernel audit logging stopped. Evidence for ENS
    op.exp.8 (user activity logging) and op.exp.10 (protection of logs). Requires agents to collect
    /var/log/audit/audit.log (auditd integration). Fixes the 4.x set, where rule 100330 also lowered
    'auditd daemon end' from level 10 to 3.
